# general setting
backend: dp # DataParallel
type: SGMatch_Model
num_gpu: auto
manual_seed: 1234
heat_diffusion_tau: 1.0e-4
use_diffusion: true
n_lb: 140
n_elas: 60
refine: 15
non-isometric: true
partial: false
visualize: true

# path
path:
  resume_state: checkpoints/smal.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairSmalDataset
    phase: test
    data_root: ../data/SMAL_r
    category: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 3
    out_channels: 256
    cache_dir: ../data/SMAL_r/diffusion
    input_type: xyz
  fmap_net:
    type: RegularizedFMNet
    bidirectional: false
  expanded_fmap_net:
    type: ExpandedResolventFMNet
    lmbda: 50
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
    hard: true
  flow_field:
    type: FlowField
    in_channels: 256
    hidden_dim: 512
    depth: 4
  cross_attention:
    type: CrossAttentionFusion
    geo_dim: 256
    sem_dim: 768
    attn_dim: 256
    num_heads: 8

# training setting
train:
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    flow_field:
      type: Adam
      lr: 1.0e-3
    cross_attention:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: none
    flow_field:
      type: none
    cross_attention:
      type: none
  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 0.0
    hs_surfmnet_loss:
      type: HS_SURFMNetLoss
      w_bij: 1.0
      w_orth: 0.0
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    hs_align_loss:
      type: SquaredHilbertSchmidtLoss
      loss_weight: 1.0
    flow_matching_loss:
      type: FlowMatchingLoss
      loss_weight: 100.0
      sample_ratio: 0.5
      alpha: 2.0
    dirichlet_loss:
      type: DirichletLoss
      loss_weight: 5.0

# validation setting
val:
  save_geo_errors: true
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck_per_pair:
      type: plot_pck_multiple
    plot_pck:
      type: plot_pck
