# general setting
backend: dp # DataParallel
type: SGMatch_Model
num_gpu: auto
manual_seed: 1234
heat_diffusion_tau: 1.0e-4
n_lb: 140
n_elas: 60
non-isometric: false
partial: false
visualize: true
neigh_k: 32

# path
path:
  resume_state: checkpoints/dt4d.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: Val
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r
    inter_class: false
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 128
    out_channels: 256
    cache_dir: ../data/DT4D_r/diffusion
    input_type: wks
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  expanded_fmap_net:
    type: ExpandedResolventFMNet
    lmbda: 50
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
  flow_field:
    type: FlowField
    in_channels: 256
    hidden_dim: 512
    depth: 4
  cross_attention:
    type: CrossAttentionFusion
    geo_dim: 256
    sem_dim: 768
    attn_dim: 256
    num_heads: 8

# validation setting
val:
  save_geo_errors: true
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck_per_pair:
      type: plot_pck_multiple
    plot_pck:
      type: plot_pck
