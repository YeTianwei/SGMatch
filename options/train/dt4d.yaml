backend: dp
type: SGMatch_Model
num_gpu: auto
manual_seed: 1234
heat_diffusion_tau: 1.0e-4
non-isometric: false
partial: false
n_lb: 140
n_elas: 60
neigh_k: 32

path:
  resume_state:

# datasets
datasets:
  train_dataset1:
    name: DT4DIntraTrain
    type: PairDT4DDataset
    phase: train
    data_root: ../data/DT4D_r
    inter_class: false
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: false
    return_dist: false
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
  train_dataset2:
    name: DT4DInterTrain
    type: PairDT4DDataset
    phase: train
    data_root: ../data/DT4D_r
    inter_class: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: false
    return_dist: false
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
  test_dataset:
    name: DT4DTest
    type: PairDT4DDataset
    phase: test
    data_root: ../data/DT4D_r
    inter_class: true
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true
    return_elas_evecs: true
    bending_weight: 0.01
    return_dino: true
  batch_size: 1
  num_worker: 12

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 128
    out_channels: 256
    cache_dir: ../data/DT4D_r/diffusion
    input_type: wks
  fmap_net:
    type: RegularizedFMNet
    bidirectional: true
  expanded_fmap_net:
    type: ExpandedResolventFMNet
    lmbda: 50
    bidirectional: true
  permutation:
    type: Similarity
    tau: 0.07
  flow_field:
    type: FlowField
    in_channels: 256
    hidden_dim: 512
    depth: 4
  cross_attention:
    type: CrossAttentionFusion
    geo_dim: 256
    sem_dim: 768
    attn_dim: 256
    num_heads: 8

# training setting
train:
  total_epochs: 10
  weight_schedule: 2000
  optims:
    feature_extractor:
      type: Adam
      lr: 1.0e-3
    flow_field:
      type: Adam
      lr: 1.0e-3
    cross_attention:
      type: Adam
      lr: 1.0e-3
  schedulers:
    feature_extractor:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10
    flow_field:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10
    cross_attention:
      type: CosineAnnealingLR
      eta_min: 1.0e-4
      T_max: 10
  losses:
    surfmnet_loss:
      type: SURFMNetLoss
      w_bij: 1.0
      w_orth: 1.0
      w_lap: 0.0
    hs_surfmnet_loss:
      type: HS_SURFMNetLoss
      w_bij: 1.0
      w_orth: 0.0
      w_lap: 0.0
    align_loss:
      type: SquaredFrobeniusLoss
      loss_weight: 1.0
    hs_align_loss:
      type: SquaredHilbertSchmidtLoss
      loss_weight: 1.0
    hs_align_loss:
      type: SquaredHilbertSchmidtLoss
      loss_weight: 1.0
    flow_matching_loss:
      type: FlowMatchingLoss
      loss_weight: 100.0
      sample_ratio: 0.5
      alpha: 2.0

val:
  val_freq: 4000
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck

# log setting
logger:
  print_freq: 20
  save_checkpoint_freq: 4000
